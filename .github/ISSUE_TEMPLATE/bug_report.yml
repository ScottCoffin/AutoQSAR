name: Bug report
description: Something in QSARena does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail for us to reproduce the problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The exact command or notebook cell, and the dataset (a public benchmark name is ideal).
      placeholder: python portable_colab_qsar_bundle/run_qsarena_benchmarks.py --dataset-name tdc_caco2_wang ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the traceback or the `error` column from the affected `metrics.csv` row.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and whether a GPU was used. `conda list` output is welcome.
      placeholder: Windows 11, Python 3.11, CPU only
    validations:
      required: true
